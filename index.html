<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Mua Sắm Cá Nhân</title>
    <!-- Thư viện Confetti ăn mừng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.3);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-sub: rgba(241, 245, 249, 0.7);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #e0f2fe, #f0fdf4, #fae8ff, #f8fafc);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }

        .orb-1 { width: 380px; height: 380px; background: #38bdf8; top: -60px; left: -80px; }
        .orb-2 { width: 420px; height: 420px; background: #34d399; bottom: -100px; right: -100px; }
        #particleCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        /* Bố cục chia đôi màn hình (Split Screen Container) */
        .layout-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: relative;
            z-index: 1;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Nửa trái: Ứng dụng chính */
        .left-panel {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 30px 20px 80px;
            display: flex;
            justify-content: center;
            transition: flex 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        /* Nửa phải: Khung trình duyệt nhúng */
        .right-panel {
            width: 0%;
            height: 100vh;
            display: none;
            flex-direction: column;
            background: #ffffff;
            border-left: 2px solid #cbd5e1;
            box-shadow: -8px 0 25px rgba(0,0,0,0.08);
            transition: width 0.3s ease;
            position: relative;
        }

        .layout-wrapper.split-active .left-panel {
            flex: 1;
        }

        .layout-wrapper.split-active .right-panel {
            width: 50%;
            display: flex;
        }

        /* Thanh điều khiển của trình duyệt nhúng */
        .browser-toolbar {
            height: 52px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }

        .browser-url-bar {
            flex: 1;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            color: #475569;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .browser-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .browser-btn:hover { background: #f1f5f9; color: var(--text-main); }
        .browser-btn-close { color: var(--danger); font-weight: bold; }
        .browser-btn-close:hover { background: #fee2e2; }

        .browser-frame {
            flex: 1;
            width: 100%;
            height: calc(100% - 52px);
            border: none;
            background: #ffffff;
        }

        /* Thẻ UI */
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 1.8rem; color: #0369a1; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 22px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .form-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; }
        .form-grid { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
        label { font-size: 0.85rem; font-weight: 600; color: #334155; }

        input {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(203, 213, 225, 0.7);
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 3px var(--primary-glow); }

        .input-with-btn { display: flex; gap: 8px; }
        .input-with-btn input { flex: 1; }

        .btn-ai-search {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-size: 0.85rem;
            padding: 9px 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
        }

        .ai-recommendation-box {
            display: none;
            background: #faf5ff;
            border: 1.5px solid #e9d5ff;
            border-radius: 12px;
            padding: 12px;
            margin-top: 4px;
        }

        .ai-recommendation-box.active { display: block; }
        .ai-title { font-size: 0.85rem; font-weight: 700; color: #6b21a8; margin-bottom: 8px; display: flex; justify-content: space-between; }

        .price-chip {
            background: #f3e8ff;
            color: #7e22ce;
            padding: 3px 9px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #d8b4fe;
            display: inline-block;
            margin: 2px 4px 2px 0;
            font-size: 0.8rem;
        }

        .shop-links-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .shop-chip {
            background: white;
            color: #334155;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .shop-chip:hover { border-color: var(--primary); color: var(--primary); background: #f0f9ff; }

        /* Popup gợi ý tiền */
        .input-suggest-container { position: relative; width: 100%; }
        .input-suggest-container input { width: 100%; }

        .suggest-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            border: 1.5px solid rgba(2, 132, 199, 0.25);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 99;
            max-height: 180px;
            overflow-y: auto;
            display: none;
        }

        .suggest-dropdown.active { display: block; }
        .suggest-item { padding: 8px 12px; font-size: 0.88rem; font-weight: 600; color: #0369a1; cursor: pointer; display: flex; justify-content: space-between; }
        .suggest-item:hover { background: #e0f2fe; }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        /* Thẻ mục tiêu */
        .goal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--glass-shadow);
        }

        .goal-main { display: flex; gap: 14px; align-items: center; }
        .goal-thumb { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; background: #f1f5f9; flex-shrink: 0; }
        .goal-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .goal-title { font-size: 1.05rem; font-weight: 700; }
        .btn-delete { background: transparent; border: none; color: #94a3b8; font-size: 1.1rem; cursor: pointer; }
        .btn-delete:hover { color: var(--danger); }

        .goal-view-btn {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            background: #e0f2fe;
            padding: 4px 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            width: fit-content;
        }

        .chart-and-stats {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 14px 0 10px;
            padding: 12px;
            background: var(--glass-sub);
            border-radius: 12px;
        }

        .pie-chart { width: 50px; height: 50px; position: relative; flex-shrink: 0; }
        .pie-chart svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .pie-chart circle { fill: none; stroke-width: 3.8; stroke-linecap: round; }
        .circle-bg { stroke: #cbd5e1; }
        .circle-progress { stroke: var(--primary); transition: stroke-dashoffset 0.6s ease; }
        .pie-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.75rem; font-weight: 700; }

        .stats-text { flex: 1; }
        .stats-money { font-size: 1.1rem; font-weight: 700; }
        .stats-sub { font-size: 0.8rem; color: var(--text-muted); }

        .forecast-box {
            background: rgba(239, 246, 255, 0.8);
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 12px;
            font-size: 0.82rem;
            color: #1e40af;
        }

        .deposit-row { display: flex; gap: 8px; }
        .btn-add {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Responsive Mobile: Chuyển sang chia trên / dưới */
        @media (max-width: 850px) {
            .layout-wrapper.split-active { flex-direction: column; }
            .layout-wrapper.split-active .left-panel { flex: 1; height: 55vh; }
            .layout-wrapper.split-active .right-panel { width: 100%; height: 45vh; border-left: none; border-top: 2px solid #cbd5e1; }
        }
    </style>
</head>
<body>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<canvas id="particleCanvas"></canvas>

<div class="layout-wrapper" id="layoutWrapper">
    <!-- NỬA BÊN TRÁI: APP MỤC TIÊU TIẾT KIỆM -->
    <div class="left-panel">
        <div class="container">
            <div class="header">
                <h1>🎯 Mục Tiêu Mua Sắm</h1>
                <p>Tiết kiệm thông minh - Xem và so sánh sàn trực tiếp</p>
            </div>

            <div class="card">
                <div class="form-title">✨ Thêm mục tiêu mới</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tên món đồ / Thiết bị *</label>
                        <div class="input-with-btn">
                            <input type="text" id="name" placeholder="Ví dụ: Màn hình ASUS TUF 27 inch">
                            <button type="button" class="btn-ai-search" onclick="analyzeProduct()">⚡ So Sánh Sàn</button>
                        </div>
                        <div id="ai-box" class="ai-recommendation-box"></div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Giá cần đạt (VNĐ) *</label>
                            <div class="input-suggest-container">
                                <input type="text" inputmode="numeric" id="target" placeholder="Ví dụ: 4.500.000" oninput="handleMoneyInput(this, 'target-suggest')">
                                <div id="target-suggest" class="suggest-dropdown"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Tiền hiện có (VNĐ)</label>
                            <div class="input-suggest-container">
                                <input type="text" inputmode="numeric" id="current" placeholder="0" oninput="handleMoneyInput(this, 'current-suggest')">
                                <div id="current-suggest" class="suggest-dropdown"></div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <label>Ngày muốn mua</label>
                            <input type="date" id="deadline">
                        </div>
                        <div class="form-group">
                            <label>Link mua hàng</label>
                            <input type="url" id="link" placeholder="https://...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Link ảnh sản phẩm (URL)</label>
                        <input type="url" id="image" placeholder="Dán link ảnh hoặc để trống">
                    </div>

                    <button class="btn-submit" onclick="createGoal()">+ Lưu Kế Hoạch</button>
                </div>
            </div>

            <div id="goals-list"></div>
        </div>
    </div>

    <!-- NỬA BÊN PHẢI: TRÌNH DUYỆT CHIA ĐÔI MÀN HÌNH -->
    <div class="right-panel" id="rightPanel">
        <div class="browser-toolbar">
            <button class="browser-btn" onclick="refreshFrame()" title="Tải lại trang">🔄 Tải lại</button>
            <div class="browser-url-bar" id="browserUrlBar">Đang duyệt: https://...</div>
            <button class="browser-btn" onclick="openExternal()" title="Mở sang tab mới nếu web này chặn nhúng">↗ Mở tab ngoài</button>
            <button class="browser-btn browser-btn-close" onclick="closeSplitScreen()" title="Đóng chia đôi màn hình">✕ Đóng</button>
        </div>
        <iframe class="browser-frame" id="browserFrame" src="about:blank"></iframe>
    </div>
</div>

<script>
    /* --- BỘ ĐIỀU KHIỂN CHIA ĐÔI MÀN HÌNH (SPLIT-SCREEN) --- */
    let currentBrowserUrl = "";

    function openInSplitScreen(url) {
        if (!url) return;
        currentBrowserUrl = url;
        const wrapper = document.getElementById('layoutWrapper');
        const frame = document.getElementById('browserFrame');
        const urlBar = document.getElementById('browserUrlBar');

        wrapper.classList.add('split-active');
        urlBar.textContent = url;
        frame.src = url;
    }

    function closeSplitScreen() {
        const wrapper = document.getElementById('layoutWrapper');
        const frame = document.getElementById('browserFrame');
        wrapper.classList.remove('split-active');
        frame.src = "about:blank";
    }

    function refreshFrame() {
        const frame = document.getElementById('browserFrame');
        if (currentBrowserUrl) frame.src = currentBrowserUrl;
    }

    function openExternal() {
        if (currentBrowserUrl) window.open(currentBrowserUrl, '_blank');
    }

    /* --- BỘ ĐỊNH DẠNG DẤU CHẤM HÀNG NGHÌN & GỢI Ý TIỀN --- */
    function formatWithDots(rawStr) {
        const cleanNumber = String(rawStr).replace(/\D/g, '');
        if (!cleanNumber) return '';
        return cleanNumber.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseMoney(val) {
        if (!val) return 0;
        const clean = String(val).replace(/\./g, '').trim();
        return parseFloat(clean) || 0;
    }

    const MULTIPLIERS = [
        { factor: 1000, label: 'nghìn' },
        { factor: 10000, label: 'chục nghìn' },
        { factor: 100000, label: 'trăm nghìn' },
        { factor: 1000000, label: 'triệu' },
        { factor: 10000000, label: 'chục triệu' },
        { factor: 100000000, label: 'trăm triệu' }
    ];

    function handleMoneyInput(inputEl, dropdownId) {
        const rawDigits = inputEl.value.replace(/\D/g, '');
        inputEl.value = formatWithDots(rawDigits);

        const dropdown = document.getElementById(dropdownId);
        const val = parseFloat(rawDigits);

        if (isNaN(val) || val <= 0) {
            dropdown.classList.remove('active');
            dropdown.innerHTML = '';
            return;
        }

        let html = '';
        MULTIPLIERS.forEach(item => {
            const calculatedVal = val * item.factor;
            const formatted = formatWithDots(calculatedVal);
            html += `
                <div class="suggest-item" onclick="selectSuggestion('${inputEl.id}', ${calculatedVal}, '${dropdownId}')">
                    <span>${formatted} đ</span>
                    <span style="color:#94a3b8; font-size:0.75rem;">${item.label}</span>
                </div>
            `;
        });

        dropdown.innerHTML = html;
        dropdown.classList.add('active');
    }

    function selectSuggestion(inputId, amount, dropdownId) {
        const inputEl = document.getElementById(inputId);
        if (inputEl) inputEl.value = formatWithDots(amount);
        const dropdown = document.getElementById(dropdownId);
        if (dropdown) dropdown.classList.remove('active');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-suggest-container')) {
            document.querySelectorAll('.suggest-dropdown').forEach(d => d.classList.remove('active'));
        }
    });

    /* --- PHÂN TÍCH GIÁ & MỞ TRANG WEB NỬA MÀN HÌNH --- */
    function estimatePrice(text) {
        const lower = text.toLowerCase();
        if (lower.includes('màn hình') || lower.includes('monitor')) {
            if (lower.includes('27') && (lower.includes('144') || lower.includes('180') || lower.includes('gaming'))) {
                return { note: "Màn hình 27 inch Gaming", chips: [3890000, 4500000, 5800000] };
            }
            return { note: "Màn hình tiêu chuẩn", chips: [2490000, 3200000, 4100000] };
        }
        if (lower.includes('tai nghe') || lower.includes('chuột') || lower.includes('bàn phím')) {
            return { note: "Phụ kiện máy tính", chips: [550000, 1200000, 2400000] };
        }
        return { note: "Đồ công nghệ", chips: [1500000, 3500000, 7000000] };
    }

    function analyzeProduct() {
        const nameInput = document.getElementById('name');
        const productName = nameInput.value.trim();
        const aiBox = document.getElementById('ai-box');

        if (!productName) {
            alert("Vui lòng nhập tên sản phẩm trước!");
            nameInput.focus();
            return;
        }

        const query = encodeURIComponent(productName);
        const shopLinks = [
            { name: "CellphoneS", url: `https://cellphones.com.vn/catalogsearch/result?q=${query}` },
            { name: "Phong Vũ", url: `https://phongvu.vn/search?q=${query}` },
            { name: "Shopee", url: `https://shopee.vn/search?keyword=${query}` },
            { name: "Google Shopping", url: `https://www.google.com/search?tbm=shop&q=${query}` }
        ];

        const est = estimatePrice(productName);

        const linksHtml = shopLinks.map(s => 
            `<button type="button" class="shop-chip" onclick="handleShopClick('${s.url}')">🖥️ ${s.name}</button>`
        ).join('');

        const chipsHtml = est.chips.map(c => 
            `<span class="price-chip" onclick="applySuggestedPrice(${c})">${formatWithDots(c)} ₫</span>`
        ).join('');

        aiBox.innerHTML = `
            <div class="ai-title">
                <span>💡 Gợi ý nhanh: <b>${est.note}</b></span>
                <span style="cursor:pointer; color:#94a3b8;" onclick="this.closest('.ai-recommendation-box').classList.remove('active')">✕</span>
            </div>
            <div style="margin-bottom: 8px;">
                <span style="font-size: 0.8rem; color: #6b21a8; font-weight:600;">Mức giá phổ biến:</span> ${chipsHtml}
            </div>
            <div style="font-size: 0.8rem; font-weight: 600; color: #475569; margin-top: 6px;">Bấm để mở trực tiếp ở nửa màn hình bên cạnh:</div>
            <div class="shop-links-row">${linksHtml}</div>
        `;
        aiBox.classList.add('active');
    }

    function handleShopClick(url) {
        document.getElementById('link').value = url;
        openInSplitScreen(url);
    }

    function applySuggestedPrice(price) {
        document.getElementById('target').value = formatWithDots(price);
    }

    /* --- CANVAS BỤI SAO NỀN --- */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() { this.reset(); this.y = Math.random() * canvas.height; }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + 20;
            this.size = Math.random() * 2.5 + 1;
            this.speedY = Math.random() * 0.6 + 0.3;
            this.alpha = Math.random() * 0.4 + 0.2;
        }
        update() {
            this.y -= this.speedY;
            if (this.y < -10) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(2, 132, 199, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    for (let i = 0; i < 35; i++) particles.push(new Particle());
    function anim() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(anim);
    }
    anim();

    /* --- QUẢN LÝ DỮ LIỆU TIẾT KIỆM --- */
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=150&auto=format&fit=crop&q=60";
    let goals = JSON.parse(localStorage.getItem('my_split_goals')) || [];

    function save() { localStorage.setItem('my_split_goals', JSON.stringify(goals)); }

    function formatVND(val) { return formatWithDots(Math.round(val)) + ' ₫'; }

    function calculateDailySavings(target, current, deadlineStr) {
        if (current >= target) return "🎉 Đã đủ tiền mua sản phẩm!";
        if (!deadlineStr) return "💡 Thêm ngày muốn mua để tính số tiền mỗi ngày.";

        const now = new Date();
        const deadline = new Date(deadlineStr);
        now.setHours(0,0,0,0); deadline.setHours(0,0,0,0);

        const diffDays = Math.ceil((deadline.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
        if (diffDays <= 0) return "⚠️ Đã đến ngày dự kiến mua!";

        const dailyMoney = Math.ceil((target - current) / diffDays);
        return `⏳ Còn <b>${diffDays} ngày</b>. Cần để dành khoảng <b>${formatVND(dailyMoney)}/ngày</b>.`;
    }

    function renderGoals() {
        const container = document.getElementById('goals-list');
        container.innerHTML = '';

        if (goals.length === 0) {
            container.innerHTML = `<div style="text-align: center; padding: 30px; color: var(--text-muted); background: var(--glass-bg); border-radius: 16px;">Chưa có mục tiêu nào. Hãy lập kế hoạch ở trên!</div>`;
            return;
        }

        goals.forEach((goal, idx) => {
            const percent = Math.min(100, Math.round((goal.current / goal.target) * 100));
            const isCompleted = goal.current >= goal.target;
            const imgSrc = goal.image || DEFAULT_IMG;
            const circumference = 2 * Math.PI * 16;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            const card = document.createElement('div');
            card.className = 'goal-card';
            card.innerHTML = `
                <div class="goal-main">
                    <img src="${imgSrc}" class="goal-thumb" onerror="this.src='${DEFAULT_IMG}'">
                    <div class="goal-info">
                        <div class="goal-header">
                            <span class="goal-title">${goal.name} ${isCompleted ? '🎊' : ''}</span>
                            <button class="btn-delete" onclick="deleteGoal(${idx})">✕</button>
                        </div>
                        ${goal.link ? `<button class="goal-view-btn" onclick="openInSplitScreen('${goal.link}')">🖥️ Xem trang bán (Nửa màn hình)</button>` : ''}
                    </div>
                </div>

                <div class="chart-and-stats">
                    <div class="pie-chart">
                        <svg viewBox="0 0 36 36">
                            <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                            <circle class="circle-progress" cx="18" cy="18" r="16"
                                stroke="${isCompleted ? 'var(--success)' : 'var(--primary)'}"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${strokeDashoffset}"></circle>
                        </svg>
                        <span class="pie-text">${percent}%</span>
                    </div>
                    <div class="stats-text">
                        <div class="stats-money">${formatVND(goal.current)}</div>
                        <div class="stats-sub">Mục tiêu: ${formatVND(goal.target)}</div>
                    </div>
                </div>

                <div class="forecast-box">${calculateDailySavings(goal.target, goal.current, goal.deadline)}</div>

                <div class="deposit-row">
                    <div class="input-suggest-container" style="flex: 1;">
                        <input type="text" inputmode="numeric" id="dep-${idx}" placeholder="Nhập tiền nạp..." oninput="handleMoneyInput(this, 'dep-suggest-${idx}')">
                        <div id="dep-suggest-${idx}" class="suggest-dropdown"></div>
                    </div>
                    <button class="btn-add" onclick="depositMoney(${idx})">+ Nạp</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function createGoal() {
        const name = document.getElementById('name').value.trim();
        const target = parseMoney(document.getElementById('target').value);
        const current = parseMoney(document.getElementById('current').value) || 0;
        const deadline = document.getElementById('deadline').value;
        const link = document.getElementById('link').value.trim();
        const image = document.getElementById('image').value.trim();

        if (!name || isNaN(target) || target <= 0) {
            alert('Vui lòng nhập tên sản phẩm và giá tiền!');
            return;
        }

        goals.push({ name, target, current, deadline, link, image });
        save();
        renderGoals();

        document.getElementById('name').value = '';
        document.getElementById('target').value = '';
        document.getElementById('current').value = '';
        document.getElementById('deadline').value = '';
        document.getElementById('link').value = '';
        document.getElementById('image').value = '';
        document.getElementById('ai-box').classList.remove('active');
    }

    function depositMoney(idx) {
        const input = document.getElementById(`dep-${idx}`);
        const amount = parseMoney(input.value);
        if (isNaN(amount) || amount === 0) return;

        const prev = goals[idx].current;
        goals[idx].current = Math.max(0, goals[idx].current + amount);

        if (goals[idx].current >= goals[idx].target && prev < goals[idx].target) {
            if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 70 });
        }
        save();
        renderGoals();
    }

    function deleteGoal(idx) {
        if (confirm(`Xóa "${goals[idx].name}"?`)) {
            goals.splice(idx, 1);
            save();
            renderGoals();
        }
    }

    renderGoals();
</script>

</body>
</html>
