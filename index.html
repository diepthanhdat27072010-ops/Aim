<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Mua Sắm Cá Nhân</title>
    <!-- Thư viện Confetti ăn mừng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.3);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-sub: rgba(241, 245, 249, 0.7);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 16px 80px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(-45deg, #e0f2fe, #f0fdf4, #fae8ff, #f8fafc);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .orb-1 { width: 380px; height: 380px; background: #38bdf8; top: -60px; left: -80px; }
        .orb-2 { width: 420px; height: 420px; background: #34d399; bottom: -100px; right: -100px; }
        .orb-3 { width: 320px; height: 320px; background: #f472b6; top: 40%; left: 60%; }

        #particleCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .container { width: 100%; max-width: 650px; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 26px; animation: fadeInDown 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .header h1 {
            font-size: 1.9rem;
            color: #0369a1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
        }
        .floating-icon { display: inline-block; animation: float 3s ease-in-out infinite; }
        .header p { font-size: 0.95rem; color: var(--text-muted); margin-top: 6px; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .form-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 16px; color: var(--text-main); }
        .form-grid { display: flex; flex-direction: column; gap: 14px; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
        label { font-size: 0.85rem; font-weight: 600; color: #334155; }

        input {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(203, 213, 225, 0.7);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-glow);
            transform: translateY(-1px);
        }

        /* Bộ nút tăng giảm số lượng */
        .qty-control {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(203, 213, 225, 0.7);
            border-radius: 12px;
            overflow: hidden;
            height: 42px;
        }

        .qty-btn {
            background: transparent;
            border: none;
            width: 38px;
            height: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .qty-btn:hover { background: #e2e8f0; }

        .qty-input {
            flex: 1;
            text-align: center;
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
            font-weight: 700;
            padding: 0 !important;
            width: 50px;
        }

        .input-with-btn { display: flex; gap: 8px; }
        .input-with-btn input { flex: 1; }

        .btn-ai-search {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-size: 0.85rem;
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .btn-ai-search:hover { transform: translateY(-1px); }

        .ai-recommendation-box {
            display: none;
            background: #faf5ff;
            border: 1.5px solid #e9d5ff;
            border-radius: 14px;
            padding: 14px;
            margin-top: 4px;
        }

        .ai-recommendation-box.active { display: block; }
        .ai-title { font-size: 0.85rem; font-weight: 700; color: #6b21a8; margin-bottom: 8px; display: flex; justify-content: space-between; }

        .price-chip {
            background: #f3e8ff;
            color: #7e22ce;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #d8b4fe;
            display: inline-block;
            margin: 2px 4px 2px 0;
            font-size: 0.85rem;
        }

        .price-chip:hover { background: #7e22ce; color: white; }

        .shop-links-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .shop-chip {
            text-decoration: none;
            background: white;
            color: #334155;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .shop-chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }

        /* Popup gợi ý bội số tiền */
        .input-suggest-container { position: relative; width: 100%; }
        .input-suggest-container input { width: 100%; }

        .suggest-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(2, 132, 199, 0.25);
            border-radius: 12px;
            box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.15);
            z-index: 99;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .suggest-dropdown.active { display: block; }

        .suggest-item {
            padding: 9px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0369a1;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggest-item:hover { background: #e0f2fe; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button:active { transform: scale(0.96); }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 6px;
            box-shadow: 0 6px 18px var(--primary-glow);
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--primary-glow); }

        .total-preview {
            font-size: 0.85rem;
            color: #0369a1;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Thẻ mục tiêu */
        .goal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
            transition: all 0.35s ease;
        }

        .goal-card:hover { transform: translateY(-4px); box-shadow: 0 20px 35px -10px rgba(2, 132, 199, 0.15); }

        .goal-main { display: flex; gap: 16px; align-items: center; }
        .goal-thumb {
            width: 86px;
            height: 86px;
            border-radius: 14px;
            object-fit: cover;
            background: rgba(241, 245, 249, 0.7);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .goal-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .goal-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }
        .goal-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0284c7;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            width: fit-content;
        }

        .btn-delete { background: transparent; color: #94a3b8; font-size: 1.2rem; padding: 2px 6px; }
        .btn-delete:hover { color: var(--danger); background: #fee2e2; border-radius: 8px; }

        .goal-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .goal-link:hover { text-decoration: underline; transform: translateX(3px); }

        .chart-and-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0 12px;
            padding: 14px;
            background: var(--glass-sub);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .pie-chart { width: 54px; height: 54px; position: relative; flex-shrink: 0; }
        .pie-chart svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .pie-chart circle { fill: none; stroke-width: 3.8; stroke-linecap: round; }
        .circle-bg { stroke: rgba(226, 232, 240, 0.8); }
        .circle-progress { stroke: var(--primary); transition: stroke-dashoffset 0.8s ease; }
        .pie-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .stats-text { flex: 1; }
        .stats-money { font-size: 1.15rem; font-weight: 700; }
        .stats-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .forecast-box {
            background: rgba(239, 246, 255, 0.8);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: #1e40af;
        }

        .deposit-row { display: flex; gap: 8px; align-items: flex-start; }
        .btn-add {
            background: var(--success);
            color: white;
            padding: 10px 18px;
            box-shadow: 0 4px 12px var(--success-glow);
            white-space: nowrap;
        }
        .btn-add:hover { background: #059669; transform: translateY(-1px); }

        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(5deg); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<canvas id="particleCanvas"></canvas>

<div class="container">
    <div class="header">
        <h1><span class="floating-icon">🎯</span> Mục Tiêu Mua Sắm</h1>
        <p>Lập kế hoạch tiết kiệm & quản lý số lượng sản phẩm</p>
    </div>

    <!-- Form Thêm Mục Tiêu -->
    <div class="card">
        <div class="form-title">✨ Thêm mục tiêu mới</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Tên món đồ / Thiết bị *</label>
                <div class="input-with-btn">
                    <input type="text" id="name" placeholder="Ví dụ: Màn hình ASUS TUF 27 inch">
                    <button type="button" class="btn-ai-search" onclick="analyzeProduct()">⚡ Gợi Ý Giá</button>
                </div>
                <div id="ai-box" class="ai-recommendation-box"></div>
            </div>

            <!-- Hàng: Đơn giá và Số lượng -->
            <div class="row">
                <div class="form-group" style="flex: 2;">
                    <label>Đơn giá 1 cái (VNĐ) *</label>
                    <div class="input-suggest-container">
                        <input type="text" inputmode="numeric" id="price" placeholder="Ví dụ: 4.500.000" oninput="handlePriceInput(this, 'price-suggest')">
                        <div id="price-suggest" class="suggest-dropdown"></div>
                    </div>
                    <div id="totalPreview" class="total-preview"></div>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label>Số lượng</label>
                    <div class="qty-control">
                        <button type="button" class="qty-btn" onclick="changeQty(-1)">−</button>
                        <input type="number" id="qty" class="qty-input" value="1" min="1" oninput="updateTotalPreview()">
                        <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Tiền hiện có (VNĐ)</label>
                    <div class="input-suggest-container">
                        <input type="text" inputmode="numeric" id="current" placeholder="0" oninput="handleMoneyInput(this, 'current-suggest')">
                        <div id="current-suggest" class="suggest-dropdown"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ngày muốn mua (Dự đoán tiến độ)</label>
                    <input type="date" id="deadline">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Link mua hàng</label>
                    <input type="url" id="link" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Link ảnh sản phẩm (URL)</label>
                    <input type="url" id="image" placeholder="Dán link ảnh hoặc để trống">
                </div>
            </div>

            <button class="btn-submit" onclick="createGoal()">+ Lưu Kế Hoạch</button>
        </div>
    </div>

    <!-- Danh Sách Mục Tiêu -->
    <div id="goals-list"></div>
</div>

<script>
    /* --- BỘ ĐỊNH DẠNG SỐ & DẤU CHẤM HÀNG NGHÌN --- */
    function formatWithDots(rawStr) {
        const cleanNumber = String(rawStr).replace(/\D/g, '');
        if (!cleanNumber) return '';
        return cleanNumber.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseMoney(val) {
        if (!val) return 0;
        const clean = String(val).replace(/\./g, '').trim();
        return parseFloat(clean) || 0;
    }

    const MULTIPLIERS = [
        { factor: 1000, label: 'nghìn' },
        { factor: 10000, label: 'chục nghìn' },
        { factor: 100000, label: 'trăm nghìn' },
        { factor: 1000000, label: 'triệu' },
        { factor: 10000000, label: 'chục triệu' },
        { factor: 100000000, label: 'trăm triệu' }
    ];

    function handlePriceInput(inputEl, dropdownId) {
        handleMoneyInput(inputEl, dropdownId);
        updateTotalPreview();
    }

    function handleMoneyInput(inputEl, dropdownId) {
        const rawDigits = inputEl.value.replace(/\D/g, '');
        inputEl.value = formatWithDots(rawDigits);

        const dropdown = document.getElementById(dropdownId);
        const val = parseFloat(rawDigits);

        if (isNaN(val) || val <= 0) {
            dropdown.classList.remove('active');
            dropdown.innerHTML = '';
            return;
        }

        let html = '';
        MULTIPLIERS.forEach(item => {
            const calculatedVal = val * item.factor;
            const formatted = formatWithDots(calculatedVal);
            html += `
                <div class="suggest-item" onclick="selectSuggestion('${inputEl.id}', ${calculatedVal}, '${dropdownId}')">
                    <span>${formatted} đ</span>
                    <span style="color:#94a3b8; font-size:0.75rem;">${item.label}</span>
                </div>
            `;
        });

        dropdown.innerHTML = html;
        dropdown.classList.add('active');
    }

    function selectSuggestion(inputId, amount, dropdownId) {
        const inputEl = document.getElementById(inputId);
        if (inputEl) {
            inputEl.value = formatWithDots(amount);
            if (inputId === 'price') updateTotalPreview();
        }
        const dropdown = document.getElementById(dropdownId);
        if (dropdown) dropdown.classList.remove('active');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-suggest-container')) {
            document.querySelectorAll('.suggest-dropdown').forEach(d => d.classList.remove('active'));
        }
    });

    /* --- XỬ LÝ SỐ LƯỢNG & TÍNH TỔNG TIỀN TRỰC TIẾP --- */
    function changeQty(delta) {
        const qtyInput = document.getElementById('qty');
        let currentQty = parseInt(qtyInput.value) || 1;
        currentQty = Math.max(1, currentQty + delta);
        qtyInput.value = currentQty;
        updateTotalPreview();
    }

    function updateTotalPreview() {
        const price = parseMoney(document.getElementById('price').value);
        const qty = parseInt(document.getElementById('qty').value) || 1;
        const totalBox = document.getElementById('totalPreview');

        if (price > 0 && qty > 1) {
            const total = price * qty;
            totalBox.innerHTML = `👉 Tổng tiền cần: <b>${formatWithDots(total)} ₫</b> (${qty} cái)`;
        } else {
            totalBox.innerHTML = '';
        }
    }

    /* --- PHÂN TÍCH GIÁ THỊ TRƯỜNG --- */
    function estimatePriceFromText(text) {
        const lower = text.toLowerCase();
        if (lower.includes('màn hình') || lower.includes('monitor')) {
            if (lower.includes('27') && (lower.includes('144') || lower.includes('180') || lower.includes('gaming'))) {
                return { note: "Màn hình 27 inch Gaming", chips: [3890000, 4500000, 5800000] };
            }
            return { note: "Màn hình tiêu chuẩn", chips: [2490000, 3200000, 4100000] };
        }
        if (lower.includes('tai nghe') || lower.includes('chuột') || lower.includes('bàn phím')) {
            return { note: "Phụ kiện máy tính", chips: [550000, 1200000, 2400000] };
        }
        return { note: "Đồ công nghệ", chips: [1500000, 3500000, 7000000] };
    }

    function analyzeProduct() {
        const nameInput = document.getElementById('name');
        const productName = nameInput.value.trim();
        const aiBox = document.getElementById('ai-box');

        if (!productName) {
            alert("Vui lòng nhập tên sản phẩm trước khi xem gợi ý!");
            nameInput.focus();
            return;
        }

        const query = encodeURIComponent(productName);
        const shopLinks = [
            { name: "Shopee", url: `https://shopee.vn/search?keyword=${query}` },
            { name: "CellphoneS", url: `https://cellphones.com.vn/catalogsearch/result?q=${query}` },
            { name: "Phong Vũ", url: `https://phongvu.vn/search?q=${query}` },
            { name: "Google Shopping", url: `https://www.google.com/search?tbm=shop&q=${query}` }
        ];

        const estimate = estimatePriceFromText(productName);
        const linksHtml = shopLinks.map(s => 
            `<a href="${s.url}" target="_blank" class="shop-chip" onclick="applyShopLink('${s.url}')">🔎 ${s.name}</a>`
        ).join('');

        const chipsHtml = estimate.chips.map(c => 
            `<span class="price-chip" onclick="applySuggestedPrice(${c})">${formatWithDots(c)} ₫</span>`
        ).join('');

        aiBox.innerHTML = `
            <div class="ai-title">
                <span>💡 Gợi ý giá đơn vị: <b>${estimate.note}</b></span>
                <span style="cursor:pointer; color:#94a3b8;" onclick="this.closest('.ai-recommendation-box').classList.remove('active')">✕</span>
            </div>
            <div style="margin-bottom: 8px;">
                <span style="font-size: 0.8rem; color: #6b21a8; font-weight:600;">Chọn nhanh đơn giá:</span> ${chipsHtml}
            </div>
            <div style="font-size: 0.8rem; font-weight: 600; color: #475569; margin-top: 6px;">Xem thực tế nơi bán (mở tab mới):</div>
            <div class="shop-links-row">${linksHtml}</div>
        `;
        aiBox.classList.add('active');
    }

    function applySuggestedPrice(price) {
        document.getElementById('price').value = formatWithDots(price);
        updateTotalPreview();
    }

    function applyShopLink(url) {
        const linkInput = document.getElementById('link');
        if (!linkInput.value) linkInput.value = url;
    }

    /* --- CANVAS BỤI SAO NỀN --- */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() { this.reset(); this.y = Math.random() * canvas.height; }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + 20;
            this.size = Math.random() * 2.8 + 1;
            this.speedY = Math.random() * 0.6 + 0.3;
            this.alpha = Math.random() * 0.4 + 0.2;
        }
        update() {
            this.y -= this.speedY;
            if (this.y < -10) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(2, 132, 199, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    for (let i = 0; i < 35; i++) particles.push(new Particle());
    function anim() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(anim);
    }
    anim();

    /* --- QUẢN LÝ DỮ LIỆU MỤC TIÊU --- */
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=150&auto=format&fit=crop&q=60";
    let goals = JSON.parse(localStorage.getItem('my_qty_goals')) || [];

    function save() { localStorage.setItem('my_qty_goals', JSON.stringify(goals)); }

    function formatVND(val) { return formatWithDots(Math.round(val)) + ' ₫'; }

    function calculateDailySavings(target, current, deadlineStr) {
        if (current >= target) return "🎉 Chúc mừng! Bạn đã đủ tiền chốt đơn!";
        if (!deadlineStr) return "💡 Thêm ngày muốn mua để hệ thống tính số tiền mỗi ngày.";

        const now = new Date();
        const deadline = new Date(deadlineStr);
        now.setHours(0,0,0,0); deadline.setHours(0,0,0,0);

        const diffDays = Math.ceil((deadline.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
        if (diffDays <= 0) return "⚠️ Đã đến ngày dự kiến mua, hãy nạp thêm nhé!";

        const dailyMoney = Math.ceil((target - current) / diffDays);
        return `⏳ Còn <b>${diffDays} ngày</b>. Cần để dành khoảng <b>${formatVND(dailyMoney)}/ngày</b>.`;
    }

    function renderGoals() {
        const container = document.getElementById('goals-list');
        container.innerHTML = '';

        if (goals.length === 0) {
            container.innerHTML = `<div style="text-align: center; padding: 36px; color: var(--text-muted); background: var(--glass-bg); border-radius: 18px;">Chưa có mục tiêu nào được tạo. Hãy lên kế hoạch ở trên!</div>`;
            return;
        }

        goals.forEach((goal, idx) => {
            const percent = Math.min(100, Math.round((goal.current / goal.target) * 100));
            const isCompleted = goal.current >= goal.target;
            const imgSrc = goal.image || DEFAULT_IMG;
            const circumference = 2 * Math.PI * 16;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            const card = document.createElement('div');
            card.className = 'goal-card';
            card.innerHTML = `
                <div class="goal-main">
                    <img src="${imgSrc}" class="goal-thumb" onerror="this.src='${DEFAULT_IMG}'">
                    <div class="goal-info">
                        <div class="goal-header">
                            <span class="goal-title">${goal.name} ${isCompleted ? '🎊' : ''}</span>
                            <button class="btn-delete" title="Xóa" onclick="deleteGoal(${idx})">✕</button>
                        </div>
                        <div class="goal-badge">Số lượng: ${goal.qty || 1} cái</div>
                        ${goal.link ? `<a href="${goal.link}" target="_blank" class="goal-link">🔗 Xem nơi bán</a>` : ''}
                    </div>
                </div>

                <div class="chart-and-stats">
                    <div class="pie-chart">
                        <svg viewBox="0 0 36 36">
                            <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                            <circle class="circle-progress" cx="18" cy="18" r="16"
                                stroke="${isCompleted ? 'var(--success)' : 'var(--primary)'}"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${strokeDashoffset}"></circle>
                        </svg>
                        <span class="pie-text">${percent}%</span>
                    </div>
                    <div class="stats-text">
                        <div class="stats-money">${formatVND(goal.current)}</div>
                        <div class="stats-sub">Mục tiêu: ${formatVND(goal.target)} ${goal.qty > 1 ? `(${formatVND(goal.price)} × ${goal.qty})` : ''}</div>
                    </div>
                </div>

                <div class="forecast-box">${calculateDailySavings(goal.target, goal.current, goal.deadline)}</div>

                <div class="deposit-row">
                    <div class="input-suggest-container" style="flex: 1;">
                        <input type="text" inputmode="numeric" id="dep-${idx}" placeholder="Nhập tiền nạp (VD: 50.000)..." oninput="handleMoneyInput(this, 'dep-suggest-${idx}')">
                        <div id="dep-suggest-${idx}" class="suggest-dropdown"></div>
                    </div>
                    <button class="btn-add" onclick="depositMoney(${idx})">+ Nạp tiền</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function createGoal() {
        const name = document.getElementById('name').value.trim();
        const unitPrice = parseMoney(document.getElementById('price').value);
        const qty = parseInt(document.getElementById('qty').value) || 1;
        const current = parseMoney(document.getElementById('current').value) || 0;
        const deadline = document.getElementById('deadline').value;
        const link = document.getElementById('link').value.trim();
        const image = document.getElementById('image').value.trim();

        if (!name || isNaN(unitPrice) || unitPrice <= 0) {
            alert('Vui lòng nhập tên sản phẩm và đơn giá hợp lệ!');
            return;
        }

        const target = unitPrice * qty;

        goals.push({ 
            name, 
            price: unitPrice, 
            qty, 
            target, 
            current, 
            deadline, 
            link, 
            image 
        });
        save();
        renderGoals();

        // Xóa form
        document.getElementById('name').value = '';
        document.getElementById('price').value = '';
        document.getElementById('qty').value = '1';
        document.getElementById('totalPreview').innerHTML = '';
        document.getElementById('current').value = '';
        document.getElementById('deadline').value = '';
        document.getElementById('link').value = '';
        document.getElementById('image').value = '';
        document.getElementById('ai-box').classList.remove('active');
    }

    function depositMoney(idx) {
        const input = document.getElementById(`dep-${idx}`);
        const amount = parseMoney(input.value);
        if (isNaN(amount) || amount === 0) return;

        const prev = goals[idx].current;
        goals[idx].current = Math.max(0, goals[idx].current + amount);

        if (goals[idx].current >= goals[idx].target && prev < goals[idx].target) {
            if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 70 });
        }
        save();
        renderGoals();
    }

    function deleteGoal(idx) {
        if (confirm(`Bạn muốn xóa "${goals[idx].name}"?`)) {
            goals.splice(idx, 1);
            save();
            renderGoals();
        }
    }

    renderGoals();
</script>

</body>
</html>
