<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Mua Sắm Cá Nhân</title>
    <!-- Thư viện Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-body: #f8fafc;
            --surface: #ffffff;
            --surface-sub: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.35);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.35);
            --danger: #ef4444;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-hover: 0 20px 30px -10px rgba(2, 132, 199, 0.12), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 36px 16px 80px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        /* Tiêu đề & Hiệu ứng icon lắc lư */
        .header {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header h1 {
            font-size: 1.85rem;
            color: #0369a1;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .floating-icon {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Thẻ form tạo mục tiêu */
        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .form-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        input {
            background: var(--surface-sub);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-glow);
            transform: translateY(-1px);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 6px;
            box-shadow: 0 4px 14px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        /* Hiệu ứng tia sáng quét ngang nút bấm */
        .btn-submit::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.35) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: shimmer 4s infinite;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        /* Thẻ mục tiêu với Animation */
        .goal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            position: relative;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .goal-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e1;
        }

        /* Rung rinh nhẹ khi nạp tiền thành công */
        .goal-card.deposit-punch {
            animation: cardPunch 0.4s ease;
        }

        .goal-main {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .goal-thumb {
            width: 84px;
            height: 84px;
            border-radius: 12px;
            object-fit: cover;
            background: #f1f5f9;
            border: 1px solid var(--border);
            flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .goal-card:hover .goal-thumb {
            transform: scale(1.06) rotate(-1.5deg);
        }

        .goal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .goal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-delete {
            background: transparent;
            color: #94a3b8;
            font-size: 1.2rem;
            padding: 2px 6px;
            line-height: 1;
            border-radius: 6px;
        }

        .btn-delete:hover {
            color: var(--danger);
            background: #fee2e2;
            transform: rotate(90deg);
        }

        .goal-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
            transition: transform 0.2s ease;
        }

        .goal-link:hover {
            transform: translateX(3px);
            text-decoration: underline;
        }

        /* Biểu đồ tròn động SVG & Số tiền */
        .chart-and-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0 12px;
            padding: 14px;
            background: var(--surface-sub);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .pie-chart {
            width: 54px;
            height: 54px;
            position: relative;
            flex-shrink: 0;
        }

        .pie-chart svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .pie-chart circle {
            fill: none;
            stroke-width: 3.8;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: #e2e8f0;
        }

        .circle-progress {
            stroke: var(--primary);
            transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease;
        }

        .pie-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stats-text {
            flex: 1;
        }

        .stats-money {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .stats-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Hộp dự đoán tiến độ */
        .forecast-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: #1e40af;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .forecast-box.completed {
            background: #dcfce7;
            border-color: #86efac;
            color: #15803d;
            animation: pulseGlow 2s infinite;
        }

        .deposit-row {
            display: flex;
            gap: 8px;
        }

        .deposit-row input {
            flex: 1;
            padding: 8px 12px;
        }

        .btn-add {
            background: var(--success);
            color: white;
            padding: 8px 18px;
            box-shadow: 0 4px 10px var(--success-glow);
        }

        .btn-add:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        /* Các Keyframes Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
        }

        @keyframes shimmer {
            0% { left: -60%; }
            100% { left: 140%; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardPunch {
            0% { transform: scale(1); }
            40% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><span class="floating-icon">🎯</span> Mục Tiêu Mua Sắm</h1>
        <p>Lập kế hoạch và theo dõi số tiền tiết kiệm mỗi ngày</p>
    </div>

    <!-- Form Thêm Mục Tiêu -->
    <div class="card">
        <div class="form-title">✨ Thêm mục tiêu mới</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Tên món đồ / Thiết bị *</label>
                <input type="text" id="name" placeholder="Ví dụ: Màn hình ASUS ROG 27 inch">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Giá cần tiết kiệm (VNĐ) *</label>
                    <input type="number" id="target" placeholder="Ví dụ: 5000000">
                </div>
                <div class="form-group">
                    <label>Tiền hiện có (VNĐ)</label>
                    <input type="number" id="current" value="0">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Ngày muốn mua (Dự đoán tiến độ)</label>
                    <input type="date" id="deadline">
                </div>
                <div class="form-group">
                    <label>Link mua hàng</label>
                    <input type="url" id="link" placeholder="https://shopee.vn/...">
                </div>
            </div>

            <div class="form-group">
                <label>Link ảnh sản phẩm (URL)</label>
                <input type="url" id="image" placeholder="Dán link ảnh hoặc để trống">
            </div>

            <button class="btn-submit" onclick="createGoal()">+ Lưu Kế Hoạch</button>
        </div>
    </div>

    <!-- Danh Sách Mục Tiêu -->
    <div id="goals-list"></div>
</div>

<script>
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=150&auto=format&fit=crop&q=60";
    let goals = JSON.parse(localStorage.getItem('my_animated_goals')) || [];

    function save() {
        localStorage.setItem('my_animated_goals', JSON.stringify(goals));
    }

    function formatVND(val) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(val);
    }

    // Hiệu ứng số chạy mượt mà (Count-Up Animation)
    function animateCountUp(element, start, end, duration = 600) {
        const startTime = performance.now();
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            // Hàm gia tốc easeOutQuad
            const easeOut = 1 - (1 - progress) * (1 - progress);
            const currentVal = Math.floor(start + (end - start) * easeOut);
            element.textContent = formatVND(currentVal);

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                element.textContent = formatVND(end);
            }
        }
        requestAnimationFrame(update);
    }

    // Tính toán số tiền mỗi ngày cần tiết kiệm
    function calculateDailySavings(target, current, deadlineStr) {
        if (current >= target) return { status: 'done', text: '🎉 Chúc mừng! Bạn đã đủ tiền để chốt đơn rồi!' };
        if (!deadlineStr) return { status: 'normal', text: '💡 Thêm ngày dự kiến mua để hệ thống tính số tiền mỗi ngày.' };

        const now = new Date();
        const deadline = new Date(deadlineStr);
        now.setHours(0, 0, 0, 0);
        deadline.setHours(0, 0, 0, 0);

        const diffTime = deadline.getTime() - now.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays <= 0) {
            return { status: 'warning', text: '⚠️ Đã tới ngày dự kiến mua, hãy tích cực nạp thêm nhé!' };
        }

        const remainingMoney = target - current;
        const dailyMoney = Math.ceil(remainingMoney / diffDays);

        return {
            status: 'plan',
            text: `⏳ Còn <b>${diffDays} ngày</b>. Bạn cần để dành khoảng <b>${formatVND(dailyMoney)}/ngày</b>.`
        };
    }

    function renderGoals(animateIdx = null, prevAmount = 0) {
        const container = document.getElementById('goals-list');
        container.innerHTML = '';

        if (goals.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-muted); background: white; border-radius: 16px; border: 1px dashed var(--border);">
                    <p style="font-size: 1.1rem;">Chưa có mục tiêu nào được tạo.</p>
                    <p style="font-size: 0.85rem; margin-top: 6px;">Hãy thêm chiếc màn hình hoặc món đồ bạn muốn ở phía trên!</p>
                </div>
            `;
            return;
        }

        goals.forEach((goal, idx) => {
            const percent = Math.min(100, Math.round((goal.current / goal.target) * 100));
            const isCompleted = goal.current >= goal.target;
            const imgSrc = goal.image || DEFAULT_IMG;
            const forecast = calculateDailySavings(goal.target, goal.current, goal.deadline);

            const circumference = 2 * Math.PI * 16;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            const card = document.createElement('div');
            card.className = `goal-card ${animateIdx === idx ? 'deposit-punch' : ''}`;
            card.innerHTML = `
                <div class="goal-main">
                    <img src="${imgSrc}" class="goal-thumb" onerror="this.src='${DEFAULT_IMG}'">
                    <div class="goal-info">
                        <div class="goal-header">
                            <span class="goal-title">${goal.name} ${isCompleted ? '🎊' : ''}</span>
                            <button class="btn-delete" title="Xóa" onclick="deleteGoal(${idx})">✕</button>
                        </div>
                        ${goal.link ? `<a href="${goal.link}" target="_blank" class="goal-link">🔗 Xem nơi bán</a>` : ''}
                    </div>
                </div>

                <div class="chart-and-stats">
                    <div class="pie-chart">
                        <svg viewBox="0 0 36 36">
                            <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                            <circle class="circle-progress" cx="18" cy="18" r="16"
                                stroke="${isCompleted ? 'var(--success)' : 'var(--primary)'}"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${circumference}"></circle>
                        </svg>
                        <span class="pie-text">${percent}%</span>
                    </div>
                    <div class="stats-text">
                        <div class="stats-money" id="money-${idx}">${formatVND(goal.current)}</div>
                        <div class="stats-sub">Mục tiêu: ${formatVND(goal.target)}</div>
                    </div>
                </div>

                <div class="forecast-box ${isCompleted ? 'completed' : ''}">
                    ${forecast.text}
                </div>

                <div class="deposit-row">
                    <input type="number" id="dep-${idx}" placeholder="Nhập số tiền nạp thêm...">
                    <button class="btn-add" onclick="depositMoney(${idx})">+ Nạp tiền</button>
                </div>
            `;
            container.appendChild(card);

            // Kích hoạt animation chạy vòng tròn sau khi thẻ gắn vào DOM
            setTimeout(() => {
                const circle = card.querySelector('.circle-progress');
                if (circle) circle.style.strokeDashoffset = strokeDashoffset;
            }, 50);

            // Chạy hiệu ứng đếm số nếu là thẻ vừa được nạp tiền
            if (animateIdx === idx) {
                const moneyEl = card.querySelector(`#money-${idx}`);
                animateCountUp(moneyEl, prevAmount, goal.current);
            }
        });
    }

    function createGoal() {
        const name = document.getElementById('name').value.trim();
        const target = parseFloat(document.getElementById('target').value);
        const current = parseFloat(document.getElementById('current').value) || 0;
        const deadline = document.getElementById('deadline').value;
        const link = document.getElementById('link').value.trim();
        const image = document.getElementById('image').value.trim();

        if (!name || isNaN(target) || target <= 0) {
            alert('Vui lòng nhập tên sản phẩm và giá tiền hợp lệ!');
            return;
        }

        goals.push({ name, target, current, deadline, link, image });
        save();
        renderGoals();

        // Xóa trắng form
        document.getElementById('name').value = '';
        document.getElementById('target').value = '';
        document.getElementById('current').value = '0';
        document.getElementById('deadline').value = '';
        document.getElementById('link').value = '';
        document.getElementById('image').value = '';
    }

    function depositMoney(idx) {
        const input = document.getElementById(`dep-${idx}`);
        const amount = parseFloat(input.value);

        if (isNaN(amount) || amount === 0) return;

        const prevCurrent = goals[idx].current;
        goals[idx].current = Math.max(0, goals[idx].current + amount);

        // Bắn pháo hoa nếu vừa cán mốc 100%
        if (goals[idx].current >= goals[idx].target && prevCurrent < goals[idx].target) {
            triggerVictoryConfetti();
        }

        save();
        renderGoals(idx, prevCurrent);
    }

    // Hiệu ứng pháo hoa hai bên màn hình
    function triggerVictoryConfetti() {
        if (typeof confetti !== 'function') return;
        const count = 200;
        const defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    }

    function deleteGoal(idx) {
        if (confirm(`Bạn muốn xóa "${goals[idx].name}"?`)) {
            goals.splice(idx, 1);
            save();
            renderGoals();
        }
    }

    renderGoals();
</script>

</body>
</html>
