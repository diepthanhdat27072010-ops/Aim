<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Mua Sắm Cá Nhân</title>
    <!-- Thư viện Confetti ăn mừng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.3);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --ai-color: #8b5cf6;
            --ai-glow: rgba(139, 92, 246, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.82);
            --glass-sub: rgba(241, 245, 249, 0.7);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 16px 80px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(-45deg, #e0f2fe, #f0fdf4, #fae8ff, #f8fafc);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .orb-1 { width: 380px; height: 380px; background: #38bdf8; top: -60px; left: -80px; animation: moveOrb1 22s ease-in-out infinite alternate; }
        .orb-2 { width: 420px; height: 420px; background: #34d399; bottom: -100px; right: -100px; animation: moveOrb2 25s ease-in-out infinite alternate; }
        .orb-3 { width: 320px; height: 320px; background: #f472b6; top: 40%; left: 60%; animation: moveOrb3 20s ease-in-out infinite alternate; }

        @keyframes moveOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(120px, 140px) scale(1.15); }
            100% { transform: translate(60px, 280px) scale(0.9); }
        }
        @keyframes moveOrb2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-140px, -120px) scale(1.1); }
            100% { transform: translate(-80px, -260px) scale(0.95); }
        }
        @keyframes moveOrb3 {
            0% { transform: translate(0, 0) scale(0.9); }
            50% { transform: translate(-100px, 80px) scale(1.2); }
            100% { transform: translate(80px, -100px) scale(1); }
        }

        #particleCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .container { width: 100%; max-width: 650px; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 26px; animation: fadeInDown 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .header h1 {
            font-size: 1.9rem;
            color: #0369a1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
        }
        .floating-icon { display: inline-block; animation: float 3s ease-in-out infinite; }
        .header p { font-size: 0.95rem; color: var(--text-muted); margin-top: 6px; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-grid { display: flex; flex-direction: column; gap: 14px; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
        label { font-size: 0.85rem; font-weight: 600; color: #334155; }

        input {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(203, 213, 225, 0.7);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-glow);
            transform: translateY(-1px);
        }

        .input-with-btn {
            display: flex;
            gap: 8px;
        }

        .input-with-btn input { flex: 1; }

        .btn-ai-search {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-size: 0.85rem;
            padding: 10px 14px;
            white-space: nowrap;
            box-shadow: 0 4px 12px var(--ai-glow);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-ai-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--ai-glow);
        }

        /* Hộp gợi ý thông minh */
        .ai-recommendation-box {
            display: none;
            background: #faf5ff;
            border: 1.5px solid #e9d5ff;
            border-radius: 14px;
            padding: 14px;
            margin-top: 4px;
            animation: fadeInDown 0.3s ease-out;
        }

        .ai-recommendation-box.active { display: block; }

        .ai-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #6b21a8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-chip {
            background: #f3e8ff;
            color: #7e22ce;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #d8b4fe;
            display: inline-block;
            margin: 2px 4px 2px 0;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .price-chip:hover {
            background: #7e22ce;
            color: white;
            transform: translateY(-1px);
        }

        .shop-links-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .shop-chip {
            text-decoration: none;
            background: white;
            color: #334155;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .shop-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* Popup gợi ý bội số tiền */
        .input-suggest-container { position: relative; width: 100%; }
        .input-suggest-container input { width: 100%; }

        .suggest-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(2, 132, 199, 0.25);
            border-radius: 12px;
            box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.15);
            z-index: 99;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            animation: fadeInDown 0.2s ease-out;
        }

        .suggest-dropdown.active { display: block; }

        .suggest-item {
            padding: 9px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0369a1;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggest-item:hover { background: #e0f2fe; }
        .suggest-tag { font-size: 0.75rem; color: #94a3b8; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button:active { transform: scale(0.96); }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 6px;
            box-shadow: 0 6px 18px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: shimmer 4s infinite;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--primary-glow); }

        .goal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .goal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 24px 40px -12px rgba(2, 132, 199, 0.16);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .goal-card.deposit-punch { animation: cardPunch 0.4s ease; }

        .goal-main { display: flex; gap: 16px; align-items: center; }
        .goal-thumb {
            width: 86px;
            height: 86px;
            border-radius: 14px;
            object-fit: cover;
            background: rgba(241, 245, 249, 0.7);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .goal-card:hover .goal-thumb { transform: scale(1.06) rotate(-2deg); }
        .goal-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .goal-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }

        .btn-delete {
            background: transparent;
            color: #94a3b8;
            font-size: 1.2rem;
            padding: 2px 6px;
            border-radius: 8px;
        }

        .btn-delete:hover { color: var(--danger); background: #fee2e2; transform: rotate(90deg); }

        .goal-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .goal-link:hover { text-decoration: underline; transform: translateX(3px); }

        .chart-and-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0 12px;
            padding: 14px;
            background: var(--glass-sub);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .pie-chart { width: 54px; height: 54px; position: relative; flex-shrink: 0; }
        .pie-chart svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .pie-chart circle { fill: none; stroke-width: 3.8; stroke-linecap: round; }
        .circle-bg { stroke: rgba(226, 232, 240, 0.8); }
        .circle-progress { stroke: var(--primary); transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease; }
        .pie-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .stats-text { flex: 1; }
        .stats-money { font-size: 1.15rem; font-weight: 700; }
        .stats-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .forecast-box {
            background: rgba(239, 246, 255, 0.8);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: #1e40af;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .forecast-box.completed {
            background: rgba(220, 252, 231, 0.85);
            border-color: #86efac;
            color: #15803d;
            animation: pulseGlow 2s infinite;
        }

        .deposit-row { display: flex; gap: 8px; align-items: flex-start; }
        .btn-add {
            background: var(--success);
            color: white;
            padding: 10px 18px;
            box-shadow: 0 4px 12px var(--success-glow);
            white-space: nowrap;
        }
        .btn-add:hover { background: #059669; transform: translateY(-1px); }

        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(5deg); } }
        @keyframes shimmer { 0% { left: -60%; } 100% { left: 140%; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardPunch { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.25); } 50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<canvas id="particleCanvas"></canvas>

<div class="container">
    <div class="header">
        <h1><span class="floating-icon">🎯</span> Mục Tiêu Mua Sắm</h1>
        <p>Lập kế hoạch tiết kiệm và trợ lý tìm giá thông minh</p>
    </div>

    <!-- Form Thêm Mục Tiêu -->
    <div class="card">
        <div class="form-title">
            <span>✨ Thêm mục tiêu mới</span>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>Tên món đồ / Thiết bị *</label>
                <div class="input-with-btn">
                    <input type="text" id="name" placeholder="Ví dụ: Màn hình ASUS ROG 27 inch 180Hz">
                    <button type="button" class="btn-ai-search" onclick="analyzeProduct()">⚡ Gợi Ý Giá</button>
                </div>
                <!-- Box gợi ý thông minh -->
                <div id="ai-box" class="ai-recommendation-box"></div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Giá cần tiết kiệm (VNĐ) *</label>
                    <div class="input-suggest-container">
                        <input type="text" inputmode="numeric" id="target" placeholder="Ví dụ: 5.200.000" oninput="handleMoneyInput(this, 'target-suggest')">
                        <div id="target-suggest" class="suggest-dropdown"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tiền hiện có (VNĐ)</label>
                    <div class="input-suggest-container">
                        <input type="text" inputmode="numeric" id="current" placeholder="0" oninput="handleMoneyInput(this, 'current-suggest')">
                        <div id="current-suggest" class="suggest-dropdown"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Ngày muốn mua (Dự đoán tiến độ)</label>
                    <input type="date" id="deadline">
                </div>
                <div class="form-group">
                    <label>Link mua hàng</label>
                    <input type="url" id="link" placeholder="https://...">
                </div>
            </div>

            <div class="form-group">
                <label>Link ảnh sản phẩm (URL)</label>
                <input type="url" id="image" placeholder="Dán link ảnh hoặc để trống">
            </div>

            <button class="btn-submit" onclick="createGoal()">+ Lưu Kế Hoạch</button>
        </div>
    </div>

    <!-- Danh Sách Mục Tiêu -->
    <div id="goals-list"></div>
</div>

<script>
    /* --- BỘ XỬ LÝ ĐỊNH DẠNG DẤU CHẤM --- */
    function formatWithDots(rawStr) {
        const cleanNumber = String(rawStr).replace(/\D/g, '');
        if (!cleanNumber) return '';
        return cleanNumber.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseMoney(val) {
        if (!val) return 0;
        const clean = String(val).replace(/\./g, '').trim();
        return parseFloat(clean) || 0;
    }

    const MULTIPLIERS = [
        { factor: 1000, label: 'nghìn' },
        { factor: 10000, label: 'chục nghìn' },
        { factor: 100000, label: 'trăm nghìn' },
        { factor: 1000000, label: 'triệu' },
        { factor: 10000000, label: 'chục triệu' },
        { factor: 100000000, label: 'trăm triệu' }
    ];

    function handleMoneyInput(inputEl, dropdownId) {
        const rawDigits = inputEl.value.replace(/\D/g, '');
        inputEl.value = formatWithDots(rawDigits);

        const dropdown = document.getElementById(dropdownId);
        const val = parseFloat(rawDigits);

        if (isNaN(val) || val <= 0) {
            dropdown.classList.remove('active');
            dropdown.innerHTML = '';
            return;
        }

        let html = '';
        MULTIPLIERS.forEach(item => {
            const calculatedVal = val * item.factor;
            const formatted = formatWithDots(calculatedVal);
            html += `
                <div class="suggest-item" onclick="selectSuggestion('${inputEl.id}', ${calculatedVal}, '${dropdownId}')">
                    <span>${formatted} đ</span>
                    <span class="suggest-tag">${item.label}</span>
                </div>
            `;
        });

        dropdown.innerHTML = html;
        dropdown.classList.add('active');
    }

    function selectSuggestion(inputId, amount, dropdownId) {
        const inputEl = document.getElementById(inputId);
        if (inputEl) inputEl.value = formatWithDots(amount);
        const dropdown = document.getElementById(dropdownId);
        if (dropdown) dropdown.classList.remove('active');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-suggest-container')) {
            document.querySelectorAll('.suggest-dropdown').forEach(d => d.classList.remove('active'));
        }
    });

    /* --- BỘ PHÂN TÍCH GIÁ THỊ TRƯỜNG OFFLINE (CHẠY NGAY 100%) --- */
    function estimatePriceFromText(text) {
        const lower = text.toLowerCase();

        // 1. Màn hình máy tính
        if (lower.includes('màn hình') || lower.includes('monitor') || lower.includes('display')) {
            if (lower.includes('4k') || lower.includes('oled') || lower.includes('rog') || lower.includes('ultrasharp')) {
                return { base: 11500000, note: "Màn hình cao cấp 4K / OLED / Đồ họa", chips: [8900000, 11500000, 14500000] };
            }
            if (lower.includes('27') && (lower.includes('144') || lower.includes('165') || lower.includes('180') || lower.includes('240') || lower.includes('gaming'))) {
                return { base: 4500000, note: "Màn hình 27 inch Gaming tần số quét cao", chips: [3890000, 4500000, 5800000] };
            }
            if (lower.includes('24') && (lower.includes('144') || lower.includes('165') || lower.includes('180'))) {
                return { base: 3100000, note: "Màn hình 24 inch Gaming phổ thông", chips: [2790000, 3190000, 3690000] };
            }
            if (lower.includes('27')) {
                return { base: 3400000, note: "Màn hình 27 inch văn phòng / giải trí", chips: [2990000, 3490000, 4200000] };
            }
            return { base: 2600000, note: "Màn hình 24 inch tiêu chuẩn", chips: [2200000, 2600000, 3200000] };
        }

        // 2. Điện thoại / Tablet
        if (lower.includes('iphone') || lower.includes('samsung galaxy') || lower.includes('ipad') || lower.includes('điện thoại')) {
            if (lower.includes('pro max') || lower.includes('ultra')) {
                return { base: 28000000, note: "Flagship cao cấp", chips: [24900000, 28500000, 32000000] };
            }
            return { base: 12000000, note: "Smartphone / Tablet tầm trung - cận cao cấp", chips: [8500000, 12000000, 16000000] };
        }

        // 3. Laptop / Máy tính
        if (lower.includes('laptop') || lower.includes('macbook') || lower.includes('pc')) {
            if (lower.includes('gaming') || lower.includes('macbook')) {
                return { base: 23000000, note: "Laptop Gaming / Đồ họa / Macbook", chips: [18900000, 23500000, 29000000] };
            }
            return { base: 14500000, note: "Laptop học tập & văn phòng", chips: [11500000, 14500000, 17900000] };
        }

        // 4. Tai nghe / Phím chuột
        if (lower.includes('tai nghe') || lower.includes('headphone') || lower.includes('earbuds') || lower.includes('airpods')) {
            if (lower.includes('pro') || lower.includes('sony') || lower.includes('airpods')) {
                return { base: 4200000, note: "Tai nghe chống ồn cao cấp", chips: [2900000, 4200000, 5900000] };
            }
            return { base: 850000, note: "Tai nghe không dây phổ thông", chips: [450000, 850000, 1350000] };
        }

        if (lower.includes('bàn phím') || lower.includes('keyboard') || lower.includes('chuột')) {
            return { base: 1200000, note: "Phụ kiện cơ / Chuột gaming", chips: [650000, 1200000, 2100000] };
        }

        // Mặc định đồ công nghệ chung
        return { base: 3000000, note: "Mức giá ước lượng phổ biến", chips: [1500000, 3000000, 6000000] };
    }

    function analyzeProduct() {
        const nameInput = document.getElementById('name');
        const productName = nameInput.value.trim();
        const aiBox = document.getElementById('ai-box');

        if (!productName) {
            alert("Vui lòng nhập tên sản phẩm trước khi xem gợi ý!");
            nameInput.focus();
            return;
        }

        const queryEncoded = encodeURIComponent(productName);
        const shopLinks = [
            { name: "Shopee", url: `https://shopee.vn/search?keyword=${queryEncoded}` },
            { name: "CellphoneS", url: `https://cellphones.com.vn/catalogsearch/result?q=${queryEncoded}` },
            { name: "Phong Vũ", url: `https://phongvu.vn/search?q=${queryEncoded}` },
            { name: "Google Mua Sắm", url: `https://www.google.com/search?tbm=shop&q=${queryEncoded}` }
        ];

        const estimate = estimatePriceFromText(productName);

        const linksHtml = shopLinks.map(s => 
            `<a href="${s.url}" target="_blank" class="shop-chip" onclick="applyShopLink('${s.url}')">🔎 ${s.name}</a>`
        ).join('');

        const chipsHtml = estimate.chips.map(c => 
            `<span class="price-chip" onclick="applySuggestedPrice(${c})" title="Click để chọn giá này">${formatWithDots(c)} ₫</span>`
        ).join('');

        aiBox.innerHTML = `
            <div class="ai-title">
                <span>💡 Gợi ý giá & Nơi bán</span>
                <span style="font-size:0.75rem; cursor:pointer; color:#94a3b8;" onclick="this.closest('.ai-recommendation-box').classList.remove('active')">Đóng ✕</span>
            </div>
            <div style="font-size: 0.85rem; color: #475569; margin-bottom: 6px;">
                Phân loại: <b>${estimate.note}</b>
            </div>
            <div style="margin-bottom: 8px;">
                <span style="font-size: 0.8rem; color: #6b21a8; font-weight:600;">Chọn nhanh mức giá:</span><br>
                ${chipsHtml}
            </div>
            <div style="font-size: 0.8rem; font-weight: 600; color: #475569; margin-top: 8px;">So sánh giá thực tế tại sàn:</div>
            <div class="shop-links-row">${linksHtml}</div>
        `;

        aiBox.classList.add('active');
    }

    function applySuggestedPrice(price) {
        const targetInput = document.getElementById('target');
        targetInput.value = formatWithDots(price);
        targetInput.style.transform = "scale(1.05)";
        setTimeout(() => targetInput.style.transform = "scale(1)", 200);
    }

    function applyShopLink(url) {
        const linkInput = document.getElementById('link');
        if (!linkInput.value) {
            linkInput.value = url;
        }
    }

    /* --- CANVAS HẠT BỤI SAO NỀN --- */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() {
            this.reset();
            this.y = Math.random() * canvas.height;
        }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = canvas.height + Math.random() * 20;
            this.size = Math.random() * 2.8 + 1.2;
            this.speedY = Math.random() * 0.7 + 0.3;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.alpha = Math.random() * 0.5 + 0.25;
            this.color = Math.random() > 0.5 ? '2, 132, 199' : '139, 92, 246';
        }
        update() {
            this.y -= this.speedY;
            this.x += this.speedX;
            if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    for (let i = 0; i < 40; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* --- QUẢN LÝ DỮ LIỆU MỤC TIÊU --- */
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=150&auto=format&fit=crop&q=60";
    let goals = JSON.parse(localStorage.getItem('my_orb_goals_v5')) || [];

    function save() {
        localStorage.setItem('my_orb_goals_v5', JSON.stringify(goals));
    }

    function formatVND(val) {
        return formatWithDots(Math.round(val)) + ' ₫';
    }

    function animateCountUp(element, start, end, duration = 600) {
        const startTime = performance.now();
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeOut = 1 - (1 - progress) * (1 - progress);
            const currentVal = Math.floor(start + (end - start) * easeOut);
            element.textContent = formatVND(currentVal);

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                element.textContent = formatVND(end);
            }
        }
        requestAnimationFrame(update);
    }

    function calculateDailySavings(target, current, deadlineStr) {
        if (current >= target) return { status: 'done', text: '🎉 Chúc mừng! Bạn đã đủ tiền để chốt đơn rồi!' };
        if (!deadlineStr) return { status: 'normal', text: '💡 Thêm ngày muốn mua để hệ thống tính số tiền mỗi ngày.' };

        const now = new Date();
        const deadline = new Date(deadlineStr);
        now.setHours(0, 0, 0, 0);
        deadline.setHours(0, 0, 0, 0);

        const diffTime = deadline.getTime() - now.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays <= 0) return { status: 'warning', text: '⚠️ Đã tới ngày dự kiến mua, hãy nạp thêm để hoàn thành nhé!' };

        const remainingMoney = target - current;
        const dailyMoney = Math.ceil(remainingMoney / diffDays);

        return {
            status: 'plan',
            text: `⏳ Còn <b>${diffDays} ngày</b>. Bạn cần để dành khoảng <b>${formatVND(dailyMoney)}/ngày</b>.`
        };
    }

    function renderGoals(animateIdx = null, prevAmount = 0) {
        const container = document.getElementById('goals-list');
        container.innerHTML = '';

        if (goals.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-muted); background: var(--glass-bg); backdrop-filter: blur(16px); border-radius: 20px; border: 1px dashed rgba(203, 213, 225, 0.8);">
                    <p style="font-size: 1.1rem; font-weight: 600;">Chưa có mục tiêu nào được tạo.</p>
                    <p style="font-size: 0.85rem; margin-top: 6px;">Hãy thêm món đồ bạn muốn mua ở phía trên!</p>
                </div>
            `;
            return;
        }

        goals.forEach((goal, idx) => {
            const percent = Math.min(100, Math.round((goal.current / goal.target) * 100));
            const isCompleted = goal.current >= goal.target;
            const imgSrc = goal.image || DEFAULT_IMG;
            const forecast = calculateDailySavings(goal.target, goal.current, goal.deadline);

            const circumference = 2 * Math.PI * 16;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            const card = document.createElement('div');
            card.className = `goal-card ${animateIdx === idx ? 'deposit-punch' : ''}`;
            card.innerHTML = `
                <div class="goal-main">
                    <img src="${imgSrc}" class="goal-thumb" onerror="this.src='${DEFAULT_IMG}'">
                    <div class="goal-info">
                        <div class="goal-header">
                            <span class="goal-title">${goal.name} ${isCompleted ? '🎊' : ''}</span>
                            <button class="btn-delete" title="Xóa" onclick="deleteGoal(${idx})">✕</button>
                        </div>
                        ${goal.link ? `<a href="${goal.link}" target="_blank" class="goal-link">🔗 Xem nơi bán</a>` : ''}
                    </div>
                </div>

                <div class="chart-and-stats">
                    <div class="pie-chart">
                        <svg viewBox="0 0 36 36">
                            <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                            <circle class="circle-progress" cx="18" cy="18" r="16"
                                stroke="${isCompleted ? 'var(--success)' : 'var(--primary)'}"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${circumference}"></circle>
                        </svg>
                        <span class="pie-text">${percent}%</span>
                    </div>
                    <div class="stats-text">
                        <div class="stats-money" id="money-${idx}">${formatVND(goal.current)}</div>
                        <div class="stats-sub">Mục tiêu: ${formatVND(goal.target)}</div>
                    </div>
                </div>

                <div class="forecast-box ${isCompleted ? 'completed' : ''}">
                    ${forecast.text}
                </div>

                <div class="deposit-row">
                    <div class="input-suggest-container" style="flex: 1;">
                        <input type="text" inputmode="numeric" id="dep-${idx}" placeholder="Nhập tiền nạp (VD: 50.000)..." oninput="handleMoneyInput(this, 'dep-suggest-${idx}')">
                        <div id="dep-suggest-${idx}" class="suggest-dropdown"></div>
                    </div>
                    <button class="btn-add" onclick="depositMoney(${idx})">+ Nạp tiền</button>
                </div>
            `;
            container.appendChild(card);

            setTimeout(() => {
                const circle = card.querySelector('.circle-progress');
                if (circle) circle.style.strokeDashoffset = strokeDashoffset;
            }, 60);

            if (animateIdx === idx) {
                const moneyEl = card.querySelector(`#money-${idx}`);
                animateCountUp(moneyEl, prevAmount, goal.current);
            }
        });
    }

    function createGoal() {
        const name = document.getElementById('name').value.trim();
        const target = parseMoney(document.getElementById('target').value);
        const current = parseMoney(document.getElementById('current').value) || 0;
        const deadline = document.getElementById('deadline').value;
        const link = document.getElementById('link').value.trim();
        const image = document.getElementById('image').value.trim();

        if (!name || isNaN(target) || target <= 0) {
            alert('Vui lòng nhập tên sản phẩm và số tiền hợp lệ!');
            return;
        }

        goals.push({ name, target, current, deadline, link, image });
        save();
        renderGoals();

        document.getElementById('name').value = '';
        document.getElementById('target').value = '';
        document.getElementById('current').value = '';
        document.getElementById('deadline').value = '';
        document.getElementById('link').value = '';
        document.getElementById('image').value = '';
        document.getElementById('ai-box').classList.remove('active');
    }

    function depositMoney(idx) {
        const input = document.getElementById(`dep-${idx}`);
        const amount = parseMoney(input.value);

        if (isNaN(amount) || amount === 0) return;

        const prevCurrent = goals[idx].current;
        goals[idx].current = Math.max(0, goals[idx].current + amount);

        if (goals[idx].current >= goals[idx].target && prevCurrent < goals[idx].target) {
            triggerVictoryConfetti();
        }

        save();
        renderGoals(idx, prevCurrent);
    }

    function triggerVictoryConfetti() {
        if (typeof confetti !== 'function') return;
        const count = 200;
        const defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    }

    function deleteGoal(idx) {
        if (confirm(`Bạn muốn xóa "${goals[idx].name}"?`)) {
            goals.splice(idx, 1);
            save();
            renderGoals();
        }
    }

    renderGoals();
</script>

</body>
</html>
