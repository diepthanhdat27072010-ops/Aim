<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Mua Sắm Cá Nhân</title>
    <!-- Thư viện pháo hoa ăn mừng nhẹ nhàng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --surface: #ffffff;
            --surface-sub: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-light: #e0f2fe;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-card: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 36px 16px 80px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        /* Tiêu đề & Animation */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #0369a1;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Thẻ form tạo mục tiêu */
        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-out;
        }

        .form-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
        }

        input {
            background: var(--surface-sub);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        /* Thẻ hiển thị mục tiêu */
        .goal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: slideUp 0.4s ease-out;
        }

        .goal-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .goal-main {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .goal-thumb {
            width: 84px;
            height: 84px;
            border-radius: 12px;
            object-fit: cover;
            background: #f1f5f9;
            border: 1px solid var(--border);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .goal-card:hover .goal-thumb {
            transform: scale(1.03);
        }

        .goal-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .goal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .btn-delete {
            background: transparent;
            color: #94a3b8;
            font-size: 1.2rem;
            padding: 0 4px;
            line-height: 1;
        }

        .btn-delete:hover {
            color: var(--danger);
        }

        .goal-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .goal-link:hover {
            text-decoration: underline;
        }

        /* Biểu đồ tròn và Thanh tiến trình */
        .chart-and-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0 12px;
            padding: 12px;
            background: var(--surface-sub);
            border-radius: 12px;
        }

        .pie-chart {
            width: 52px;
            height: 52px;
            position: relative;
            flex-shrink: 0;
        }

        .pie-chart svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .pie-chart circle {
            fill: none;
            stroke-width: 3.8;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: #e2e8f0;
        }

        .circle-progress {
            stroke: var(--primary);
            transition: stroke-dasharray 0.6s ease;
        }

        .pie-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stats-text {
            flex: 1;
        }

        .stats-money {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .stats-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Dự đoán tiến độ hàng ngày */
        .forecast-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: #1e40af;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .forecast-box.completed {
            background: var(--success-light);
            border-color: #a7f3d0;
            color: #065f46;
        }

        .deposit-row {
            display: flex;
            gap: 8px;
        }

        .deposit-row input {
            flex: 1;
            padding: 8px 12px;
        }

        .btn-add {
            background: var(--success);
            color: white;
            padding: 8px 16px;
        }

        .btn-add:hover {
            background: #059669;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎯 Mục Tiêu Mua Sắm</h1>
        <p>Lập kế hoạch và theo dõi số tiền tiết kiệm mỗi ngày</p>
    </div>

    <!-- Form Thêm Mục Tiêu -->
    <div class="card">
        <div class="form-title">✨ Thêm mục tiêu mới</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Tên món đồ / Thiết bị *</label>
                <input type="text" id="name" placeholder="Ví dụ: Màn hình ASUS ROG 27 inch">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Giá cần tiết kiệm (VNĐ) *</label>
                    <input type="number" id="target" placeholder="Ví dụ: 5000000">
                </div>
                <div class="form-group">
                    <label>Tiền hiện có (VNĐ)</label>
                    <input type="number" id="current" value="0">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Ngày muốn mua (Dự đoán tiến độ)</label>
                    <input type="date" id="deadline">
                </div>
                <div class="form-group">
                    <label>Link mua hàng</label>
                    <input type="url" id="link" placeholder="https://shopee.vn/...">
                </div>
            </div>

            <div class="form-group">
                <label>Link ảnh sản phẩm (URL)</label>
                <input type="url" id="image" placeholder="Dán link ảnh hoặc để trống dùng ảnh ngẫu hứng">
            </div>

            <button class="btn-submit" onclick="createGoal()">+ Lưu Kế Hoạch</button>
        </div>
    </div>

    <!-- Danh Sách Mục Tiêu -->
    <div id="goals-list"></div>
</div>

<script>
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=150&auto=format&fit=crop&q=60";
    let goals = JSON.parse(localStorage.getItem('my_bright_goals')) || [];

    function save() {
        localStorage.setItem('my_bright_goals', JSON.stringify(goals));
    }

    function formatVND(val) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(val);
    }

    // Tính toán số tiền mỗi ngày cần để dành
    function calculateDailySavings(target, current, deadlineStr) {
        if (current >= target) return { status: 'done', text: '🎉 Chúc mừng! Bạn đã đủ tiền để chốt đơn rồi!' };
        if (!deadlineStr) return { status: 'normal', text: '💡 Thêm ngày dự kiến mua để hệ thống tính số tiền tiết kiệm mỗi ngày.' };

        const now = new Date();
        const deadline = new Date(deadlineStr);
        // Đặt giờ về 0 để so sánh chính xác theo ngày
        now.setHours(0, 0, 0, 0);
        deadline.setHours(0, 0, 0, 0);

        const diffTime = deadline.getTime() - now.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (diffDays <= 0) {
            return { status: 'warning', text: '⚠️ Đã tới hoặc qua ngày dự kiến mua, hãy nỗ lực nạp thêm tiền nhé!' };
        }

        const remainingMoney = target - current;
        const dailyMoney = Math.ceil(remainingMoney / diffDays);

        return {
            status: 'plan',
            text: `⏳ Còn <b>${diffDays} ngày</b>. Bạn cần để dành khoảng <b>${formatVND(dailyMoney)}/ngày</b>.`
        };
    }

    function renderGoals() {
        const container = document.getElementById('goals-list');
        container.innerHTML = '';

        if (goals.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-muted); background: white; border-radius: 16px; border: 1px dashed var(--border);">
                    <p style="font-size: 1.1rem;">Chưa có mục tiêu nào được tạo.</p>
                    <p style="font-size: 0.85rem; margin-top: 6px;">Hãy đặt mục tiêu chiếc màn hình bạn muốn ở trên nhé!</p>
                </div>
            `;
            return;
        }

        goals.forEach((goal, idx) => {
            const percent = Math.min(100, Math.round((goal.current / goal.target) * 100));
            const isCompleted = goal.current >= goal.target;
            const imgSrc = goal.image || DEFAULT_IMG;
            const forecast = calculateDailySavings(goal.target, goal.current, goal.deadline);

            // Tính chu vi biểu đồ tròn SVG (bán kính r = 16 => C ≈ 100)
            const circumference = 2 * Math.PI * 16;
            const strokeDashoffset = circumference - (percent / 100) * circumference;

            const card = document.createElement('div');
            card.className = 'goal-card';
            card.innerHTML = `
                <div class="goal-main">
                    <img src="${imgSrc}" class="goal-thumb" onerror="this.src='${DEFAULT_IMG}'">
                    <div class="goal-info">
                        <div class="goal-header">
                            <span class="goal-title">${goal.name}</span>
                            <button class="btn-delete" title="Xóa" onclick="deleteGoal(${idx})">✕</button>
                        </div>
                        ${goal.link ? `<a href="${goal.link}" target="_blank" class="goal-link">🔗 Xem nơi bán</a>` : ''}
                    </div>
                </div>

                <div class="chart-and-stats">
                    <div class="pie-chart">
                        <svg viewBox="0 0 36 36">
                            <circle class="circle-bg" cx="18" cy="18" r="16"></circle>
                            <circle class="circle-progress" cx="18" cy="18" r="16"
                                stroke="${isCompleted ? 'var(--success)' : 'var(--primary)'}"
                                stroke-dasharray="${circumference}"
                                stroke-dashoffset="${strokeDashoffset}"></circle>
                        </svg>
                        <span class="pie-text">${percent}%</span>
                    </div>
                    <div class="stats-text">
                        <div class="stats-money">${formatVND(goal.current)}</div>
                        <div class="stats-sub">Mục tiêu: ${formatVND(goal.target)}</div>
                    </div>
                </div>

                <div class="forecast-box ${isCompleted ? 'completed' : ''}">
                    ${forecast.text}
                </div>

                <div class="deposit-row">
                    <input type="number" id="dep-${idx}" placeholder="Nhập số tiền nạp thêm...">
                    <button class="btn-add" onclick="depositMoney(${idx})">+ Nạp tiền</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function createGoal() {
        const name = document.getElementById('name').value.trim();
        const target = parseFloat(document.getElementById('target').value);
        const current = parseFloat(document.getElementById('current').value) || 0;
        const deadline = document.getElementById('deadline').value;
        const link = document.getElementById('link').value.trim();
        const image = document.getElementById('image').value.trim();

        if (!name || isNaN(target) || target <= 0) {
            alert('Vui lòng nhập tên sản phẩm và giá tiền hợp lệ!');
            return;
        }

        goals.push({ name, target, current, deadline, link, image });
        save();
        renderGoals();

        // Xóa form sau khi thêm
        document.getElementById('name').value = '';
        document.getElementById('target').value = '';
        document.getElementById('current').value = '0';
        document.getElementById('deadline').value = '';
        document.getElementById('link').value = '';
        document.getElementById('image').value = '';
    }

    function depositMoney(idx) {
        const input = document.getElementById(`dep-${idx}`);
        const amount = parseFloat(input.value);

        if (isNaN(amount) || amount === 0) return;

        const prevCurrent = goals[idx].current;
        goals[idx].current = Math.max(0, goals[idx].current + amount);

        // Bắn pháo hoa nếu vượt mốc 100%
        if (goals[idx].current >= goals[idx].target && prevCurrent < goals[idx].target) {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        save();
        renderGoals();
    }

    function deleteGoal(idx) {
        if (confirm(`Bạn muốn xóa "${goals[idx].name}"?`)) {
            goals.splice(idx, 1);
            save();
            renderGoals();
        }
    }

    renderGoals();
</script>

</body>
</html>
