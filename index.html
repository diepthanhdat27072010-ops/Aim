<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mục Tiêu Mua Sắm Cá Nhân</title>
    <!-- Thư viện Confetti ăn mừng -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-glow: rgba(2, 132, 199, 0.3);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --ai-color: #8b5cf6;
            --ai-glow: rgba(139, 92, 246, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.82);
            --glass-sub: rgba(241, 245, 249, 0.7);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 16px 36px -10px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 16px 80px;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(-45deg, #e0f2fe, #f0fdf4, #fae8ff, #f8fafc);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.55;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .orb-1 { width: 380px; height: 380px; background: #38bdf8; top: -60px; left: -80px; animation: moveOrb1 22s ease-in-out infinite alternate; }
        .orb-2 { width: 420px; height: 420px; background: #34d399; bottom: -100px; right: -100px; animation: moveOrb2 25s ease-in-out infinite alternate; }
        .orb-3 { width: 320px; height: 320px; background: #f472b6; top: 40%; left: 60%; animation: moveOrb3 20s ease-in-out infinite alternate; }

        @keyframes moveOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(120px, 140px) scale(1.15); }
            100% { transform: translate(60px, 280px) scale(0.9); }
        }
        @keyframes moveOrb2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-140px, -120px) scale(1.1); }
            100% { transform: translate(-80px, -260px) scale(0.95); }
        }
        @keyframes moveOrb3 {
            0% { transform: translate(0, 0) scale(0.9); }
            50% { transform: translate(-100px, 80px) scale(1.2); }
            100% { transform: translate(80px, -100px) scale(1); }
        }

        #particleCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .container { width: 100%; max-width: 650px; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 26px; animation: fadeInDown 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .header h1 {
            font-size: 1.9rem;
            color: #0369a1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
        }
        .floating-icon { display: inline-block; animation: float 3s ease-in-out infinite; }
        .header p { font-size: 0.95rem; color: var(--text-muted); margin-top: 6px; }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ai-key-btn {
            background: transparent;
            color: var(--ai-color);
            font-size: 0.8rem;
            padding: 4px 8px;
            border: 1px dashed var(--ai-color);
            border-radius: 8px;
        }

        .ai-key-btn:hover { background: rgba(139, 92, 246, 0.1); }

        .form-grid { display: flex; flex-direction: column; gap: 14px; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        .form-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
        label { font-size: 0.85rem; font-weight: 600; color: #334155; }

        input {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(203, 213, 225, 0.7);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-glow);
            transform: translateY(-1px);
        }

        /* Khung nhập tên kết hợp nút AI */
        .input-with-btn {
            display: flex;
            gap: 8px;
        }

        .input-with-btn input { flex: 1; }

        .btn-ai-search {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            font-size: 0.85rem;
            padding: 10px 14px;
            white-space: nowrap;
            box-shadow: 0 4px 12px var(--ai-glow);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-ai-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--ai-glow);
        }

        /* Hộp gợi ý từ AI & Website */
        .ai-recommendation-box {
            display: none;
            background: #faf5ff;
            border: 1.5px solid #e9d5ff;
            border-radius: 14px;
            padding: 14px;
            margin-top: 4px;
            animation: fadeInDown 0.3s ease-out;
        }

        .ai-recommendation-box.active { display: block; }

        .ai-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #6b21a8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-chip {
            background: #f3e8ff;
            color: #7e22ce;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #d8b4fe;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .price-chip:hover {
            background: #7e22ce;
            color: white;
        }

        .shop-links-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .shop-chip {
            text-decoration: none;
            background: white;
            color: #334155;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .shop-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        /* Popup gợi ý bội số tiền */
        .input-suggest-container { position: relative; width: 100%; }
        .input-suggest-container input { width: 100%; }

        .suggest-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(2, 132, 199, 0.25);
            border-radius: 12px;
            box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.15);
            z-index: 99;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            animation: fadeInDown 0.2s ease-out;
        }

        .suggest-dropdown.active { display: block; }

        .suggest-item {
            padding: 9px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0369a1;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggest-item:hover { background: #e0f2fe; }
        .suggest-tag { font-size: 0.75rem; color: #94a3b8; }

        button {
            cursor: pointer;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button:active { transform: scale(0.96); }

        .btn-submit {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 6px;
            box-shadow: 0 6px 18px var(--primary-glow);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: shimmer 4s infinite;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--primary-glow); }

        .goal-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .goal-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 24px 40px -12px rgba(2, 132, 199, 0.16);
            border-color: rgba(255, 255, 255, 0.95);
        }

        .goal-card.deposit-punch { animation: cardPunch 0.4s ease; }

        .goal-main { display: flex; gap: 16px; align-items: center; }
        .goal-thumb {
            width: 86px;
            height: 86px;
            border-radius: 14px;
            object-fit: cover;
            background: rgba(241, 245, 249, 0.7);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .goal-card:hover .goal-thumb { transform: scale(1.06) rotate(-2deg); }
        .goal-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .goal-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .goal-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }

        .btn-delete {
            background: transparent;
            color: #94a3b8;
            font-size: 1.2rem;
            padding: 2px 6px;
            border-radius: 8px;
        }

        .btn-delete:hover { color: var(--danger); background: #fee2e2; transform: rotate(90deg); }

        .goal-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .goal-link:hover { text-decoration: underline; transform: translateX(3px); }

        .chart-and-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 16px 0 12px;
            padding: 14px;
            background: var(--glass-sub);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .pie-chart { width: 54px; height: 54px; position: relative; flex-shrink: 0; }
        .pie-chart svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .pie-chart circle { fill: none; stroke-width: 3.8; stroke-linecap: round; }
        .circle-bg { stroke: rgba(226, 232, 240, 0.8); }
        .circle-progress { stroke: var(--primary); transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease; }
        .pie-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .stats-text { flex: 1; }
        .stats-money { font-size: 1.15rem; font-weight: 700; }
        .stats-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        .forecast-box {
            background: rgba(239, 246, 255, 0.8);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: #1e40af;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .forecast-box.completed {
            background: rgba(220, 252, 231, 0.85);
            border-color: #86efac;
            color: #15803d;
            animation: pulseGlow 2s infinite;
        }

        .deposit-row { display: flex; gap: 8px; align-items: flex-start; }
        .btn-add {
            background: var(--success);
            color: white;
            padding: 10px 18px;
            box-shadow: 0 4px 12px var(--success-glow);
            white-space: nowrap;
        }
        .btn-add:hover { background: #059669; transform: translateY(-1px); }

        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(5deg); } }
        @keyframes shimmer { 0% { left: -60%; } 100% { left: 140%; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes cardPunch { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.25); } 50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>

<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<canvas id="particleCanvas"></canvas>

<div class="container">
    <div class="header">
        <h1><span class="floating-icon">🎯</span> Mục Tiêu Mua Sắm</h1>
        <p>Lập kế hoạch tiết kiệm kết hợp trợ lý tìm kiếm giá thông minh</p>
    </div>

    <!-- Form Thêm Mục Tiêu -->
    <div class="card">
        <div class="form-title">
            <span>✨ Thêm mục tiêu mới</span>
            <button type="button" class="ai-key-btn" onclick="configureApiKey()">⚙️ Cài đặt Gemini Key</button>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>Tên món đồ / Thiết bị *</label>
                <div class="input-with-btn">
                    <input type="text" id="name" placeholder="Ví dụ: Màn hình ASUS ROG 27 inch 180Hz">
                    <button type="button" class="btn-ai-search" onclick="analyzeProductWithAI()">✨ AI Tìm Giá</button>
                </div>
                <!-- Box kết quả gợi ý từ AI & Web -->
                <div id="ai-box" class="ai-recommendation-box"></div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Giá cần tiết kiệm (VNĐ) *</label>
                    <div class="input-suggest-container">
                        <input type="text" inputmode="numeric" id="target" placeholder="Ví dụ: 5.200.000" oninput="handleMoneyInput(this, 'target-suggest')">
                        <div id="target-suggest" class="suggest-dropdown"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tiền hiện có (VNĐ)</label>
                    <div class="input-suggest-container">
                        <input type="text" inputmode="numeric" id="current" placeholder="0" oninput="handleMoneyInput(this, 'current-suggest')">
                        <div id="current-suggest" class="suggest-dropdown"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Ngày muốn mua (Dự đoán tiến độ)</label>
                    <input type="date" id="deadline">
                </div>
                <div class="form-group">
                    <label>Link mua hàng</label>
                    <input type="url" id="link" placeholder="https://...">
                </div>
            </div>

            <div class="form-group">
                <label>Link ảnh sản phẩm (URL)</label>
                <input type="url" id="image" placeholder="Dán link ảnh hoặc để trống">
            </div>

            <button class="btn-submit" onclick="createGoal()">+ Lưu Kế Hoạch</button>
        </div>
    </div>

    <!-- Danh Sách Mục Tiêu -->
    <div id="goals-list"></div>
</div>

<script>
    /* --- BỘ XỬ LÝ ĐỊNH DẠNG SỐ VÀ TIỀN TỆ --- */
    function formatWithDots(rawStr) {
        const cleanNumber = String(rawStr).replace(/\D/g, '');
        if (!cleanNumber) return '';
        return cleanNumber.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseMoney(val) {
        if (!val) return 0;
        const clean = String(val).replace(/\./g, '').trim();
        return parseFloat(clean) || 0;
    }

    const MULTIPLIERS = [
        { factor: 1000, label: 'nghìn' },
        { factor: 10000, label: 'chục nghìn' },
        { factor: 100000, label: 'trăm nghìn' },
        { factor: 1000000, label: 'triệu' },
        { factor: 10000000, label: 'chục triệu' },
        { factor: 100000000, label: 'trăm triệu' }
    ];

    function handleMoneyInput(inputEl, dropdownId) {
        const rawDigits = inputEl.value.replace(/\D/g, '');
        inputEl.value = formatWithDots(rawDigits);

        const dropdown = document.getElementById(dropdownId);
        const val = parseFloat(rawDigits);

        if (isNaN(val) || val <= 0) {
            dropdown.classList.remove('active');
            dropdown.innerHTML = '';
            return;
        }

        let html = '';
        MULTIPLIERS.forEach(item => {
            const calculatedVal = val * item.factor;
            const formatted = formatWithDots(calculatedVal);
            html += `
                <div class="suggest-item" onclick="selectSuggestion('${inputEl.id}', ${calculatedVal}, '${dropdownId}')">
                    <span>${formatted} đ</span>
                    <span class="suggest-tag">${item.label}</span>
                </div>
            `;
        });

        dropdown.innerHTML = html;
        dropdown.classList.add('active');
    }

    function selectSuggestion(inputId, amount, dropdownId) {
        const inputEl = document.getElementById(inputId);
        if (inputEl) inputEl.value = formatWithDots(amount);
        const dropdown = document.getElementById(dropdownId);
        if (dropdown) dropdown.classList.remove('active');
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.input-suggest-container')) {
            document.querySelectorAll('.suggest-dropdown').forEach(d => d.classList.remove('active'));
        }
    });

    /* --- TÍNH NĂNG AI & GỢI Ý TRANG WEB MUA SẮM --- */
    function configureApiKey() {
        const currentKey = localStorage.getItem('user_gemini_api_key') || '';
        const key = prompt("Nhập Gemini API Key miễn phí của bạn (Lấy tại aistudio.google.com):", currentKey);
        if (key !== null) {
            localStorage.setItem('user_gemini_api_key', key.trim());
            alert(key.trim() ? "Đã lưu Gemini API Key thành công!" : "Đã xóa API Key.");
        }
    }

    async function analyzeProductWithAI() {
        const nameInput = document.getElementById('name');
        const productName = nameInput.value.trim();
        const aiBox = document.getElementById('ai-box');

        if (!productName) {
            alert("Vui lòng nhập tên sản phẩm trước khi tìm kiếm!");
            nameInput.focus();
            return;
        }

        aiBox.classList.add('active');
        aiBox.innerHTML = `<span style="font-size:0.85rem; color:#7e22ce;">⏳ Đang tìm kiếm giá & sàn bán uy tín cho "${productName}"...</span>`;

        // Tạo sẵn các link tìm kiếm nhanh trên các sàn thương mại
        const queryEncoded = encodeURIComponent(productName);
        const shopLinks = [
            { name: "Shopee", url: `https://shopee.vn/search?keyword=${queryEncoded}` },
            { name: "CellphoneS", url: `https://cellphones.com.vn/catalogsearch/result?q=${queryEncoded}` },
            { name: "Phong Vũ", url: `https://phongvu.vn/search?q=${queryEncoded}` },
            { name: "Google Shopping", url: `https://www.google.com/search?tbm=shop&q=${queryEncoded}` }
        ];

        let estimatedPrice = null;
        let aiNote = "";
        const apiKey = localStorage.getItem('user_gemini_api_key');

        // Nếu có API Key, dùng Gemini để dự đoán giá chuẩn xác
        if (apiKey) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Bạn là trợ lý mua sắm. Với sản phẩm: "${productName}". Hãy ước lượng mức giá bán phổ biến tại thị trường Việt Nam (tính bằng VND). Chỉ trả về JSON có cấu trúc đúng định dạng: {"price": 5000000, "note": "Khoảng 4.800.000 - 5.500.000đ"}. Tuyệt đối không thêm chữ ngoài JSON.`
                            }]
                        }]
                    })
                });
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) {
                    const cleanJson = text.replace(/```json|
